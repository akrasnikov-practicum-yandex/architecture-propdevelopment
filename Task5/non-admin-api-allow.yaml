---
# 1. Default-deny: для всех 4 ролей запрещаем и Ingress, и Egress по умолчанию.
# Реализует zero-trust на уровне подов (см. Task 2, чек-лист III.2 «сегментация»
# и III.11 «фильтрация трафика между сегментами»).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["front-end", "back-end-api", "admin-front-end", "admin-back-end-api"]
  policyTypes:
    - Ingress
    - Egress

---
# 2. Egress на kube-dns (UDP/TCP 53) — иначе резолв `http://<svc>` ломается
# и тесты из task-5.md падают на DNS, а не на NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: default
spec:
  podSelector:
    matchExpressions:
      - key: role
        operator: In
        values: ["front-end", "back-end-api", "admin-front-end", "admin-back-end-api"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 3. Не-админский контур: front-end <-> back-end-api.
# Ingress на back-end-api только от front-end + Egress c front-end только в back-end-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: non-admin-api-allow
  namespace: default
spec:
  podSelector:
    matchLabels:
      role: back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: front-end
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: front-end-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      role: front-end
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: back-end-api
      ports:
        - protocol: TCP
          port: 80

---
# 4. Админский контур: admin-front-end <-> admin-back-end-api.
# Соответствует требованию Task 1/2: операции с CN-3, CN-4, CN-5 (🔴) изолированы
# от внешнего контура — front-end физически не достанет до admin-back-end-api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-api-allow
  namespace: default
spec:
  podSelector:
    matchLabels:
      role: admin-back-end-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: admin-front-end
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-front-end-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      role: admin-front-end
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              role: admin-back-end-api
      ports:
        - protocol: TCP
          port: 80
