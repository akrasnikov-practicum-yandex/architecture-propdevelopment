---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-viewers
  namespace: default
subjects:
- kind: ServiceAccount
  name: viewer-user
  namespace: default
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-editors
  namespace: default
subjects:
- kind: ServiceAccount
  name: editor-user
  namespace: default
roleRef:
  kind: Role
  name: cluster-editor
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-sec-admins
  namespace: default
subjects:
- kind: ServiceAccount
  name: sec-admin-user
  namespace: default
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
