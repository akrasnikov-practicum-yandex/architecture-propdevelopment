apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer-role
rules:
- apiGroups: ["", "apps", "batch", "extensions"]
  resources:
    - pods
    - pods/log
    - services
    - endpoints
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - configmaps
    - jobs
    - cronjobs
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: configurator-role
rules:
- apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
  resources:
    - pods
    - services
    - endpoints
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - configmaps
    - networkpolicies
    - jobs
    - cronjobs
    - persistentvolumeclaims
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-admin-role
rules:
- apiGroups: [""]
  resources:
    - secrets
    - pods
    - services
    - nodes
    - namespaces
    - persistentvolumes
    - serviceaccounts
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
    - roles
    - rolebindings
    - clusterroles
    - clusterrolebindings
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
